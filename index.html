<style>
:root{--bg:#f3f2ef;--card:#fff;--ink:#16181d;--mute:#7b7f88;--line:#e3e1dc;--w:#1b8a4b;--l:#c23b3b;--d:#8a8f98;--ac:#034694;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2026;--ink:#eceae6;--mute:#8d929c;--line:#2a2e36;--w:#3fbf7a;--l:#ee6a6a;--d:#9aa0aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:14px 16px 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:800}
#sync{font-size:12px;color:var(--mute);margin-top:2px}
#th{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1;padding:0;font-family:system-ui,-apple-system,sans-serif}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
html,body{overscroll-behavior-y:contain}
html.lock,html.lock body{overflow:hidden;height:100%}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{min-width:0;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:12px;padding:10px 4px;font:700 14px system-ui;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}
.tab span:not(.hint){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab.on{color:var(--ink);border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:18px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px 4px;border-radius:10px;font:700 14px system-ui;font-family:inherit}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg small{font-weight:600;opacity:.7;margin-left:4px}
.lsg{margin:8px 0 12px}
.mks{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}.mk{display:inline-flex;align-items:center;gap:2px;font-size:12px;line-height:1}.mk small{font-size:10px;font-weight:700;color:var(--mute)}
.cd{display:inline-block;flex:none;width:10px;min-width:10px;max-width:10px;height:14px;border-radius:2px;vertical-align:-2px}.cd.y{background:#f4c20d}.cd.r{background:#d63030}.lsg button.on{background:var(--lc,var(--ac));color:#fff;box-shadow:none}.lsg small{display:block;margin:0;font-size:11px}
main{padding:4px 16px 40px;max-width:640px;margin:0 auto}
h2{font-size:14px;font-weight:700;color:var(--mute);margin:22px 4px 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.row.next{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.dt{width:54px;flex:none;font-size:12px;color:var(--mute);line-height:1.25}
.dt b{display:block;font-size:15px;color:var(--ink)}
.mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mid img{width:30px;height:30px;object-fit:contain;flex:none}
.mid div{min-width:0}
.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{font-size:12px;color:var(--mute)}
.pill{font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--line);color:var(--mute);white-space:nowrap}
.pill.rv{background:var(--ac);color:#fff}
.tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.sc{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.sc em{font-style:normal;font-size:12px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff}
.W em{background:var(--w)}.L em{background:var(--l)}.D em{background:var(--d)}
.live{color:var(--l);font-size:11px;font-weight:800}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--mute);margin-top:12px}
#sheet,#sheet2,#sheet3{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overscroll-behavior-y:none;touch-action:pan-y;display:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 72px)}
#sheet.open,#sheet2.open,#sheet3.open{display:block}
#sheet2{z-index:30}
#sheet.over{z-index:35}
#sheet3{z-index:40}
#sheet4{position:fixed;inset:0;background:var(--bg);z-index:45;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overscroll-behavior-y:none;touch-action:pan-y;display:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 72px)}
#sheet4.open{display:block}
.who{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.who .ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--card);border:2px solid var(--line);flex:none}
.who .ph.logo{object-fit:contain;padding:10px;background:var(--card)}
.who .ini{width:84px;height:84px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.who h1{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.who .sub{color:var(--mute);font-size:13px;margin-top:3px}
.bio{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 4px}
.bio div{grid-column:span 2;min-width:0}
.bio.b5 div:nth-child(n+4){grid-column:span 3}
.bio.b4 div{grid-column:span 3}
.bio div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.bio b{display:block;font-size:15px;overflow-wrap:anywhere}.bio span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.pst{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.pst table{font-size:13px}.pst th:first-child,.pst td:first-child{position:sticky;left:0;background:var(--card);text-align:left;white-space:nowrap}
.pst td:first-child small{display:block;color:var(--mute);font-size:11px}
.pgl td:first-child{white-space:nowrap}.pgl .W{color:var(--w);font-weight:700}.pgl .L{color:var(--l);font-weight:700}.pgl .D{color:var(--d);font-weight:700}
.nm{cursor:pointer}
.rk{font-size:.78em;font-weight:700;color:var(--mute)}
.nm:active{opacity:.6}
.bar{position:sticky;top:0;display:flex;justify-content:space-between;z-index:2}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;font-family:inherit}
.dwrap{max-width:640px;margin:0 auto}
.big{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 6px;text-align:center}
.big div{flex:1;font-weight:700;font-size:14px}
.big img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 6px}
.big .n{font-size:38px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.meta{text-align:center;font-size:12px;color:var(--mute);margin-bottom:6px}
h3{font-size:16px;margin:24px 0 8px}
h3 small{color:var(--mute);font-weight:600;margin-left:6px}
h4{font-size:13px;color:var(--mute);margin:14px 0 4px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.p{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.p:last-child{border:0}
.p i{width:24px;color:var(--mute);font-style:normal;font-variant-numeric:tabular-nums}
.p>span{flex:1}.p em{font-style:normal;color:var(--mute);font-size:13px}
.ev{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev b{width:44px;flex:none;font-variant-numeric:tabular-nums}
.st{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.st span{color:var(--mute);text-align:center;flex:1}.st b{width:64px;font-variant-numeric:tabular-nums}.st b:last-child{text-align:right}
.sth{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);padding:0 4px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12px}
tr+tr td{border-top:1px solid var(--line)}
.ld{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ld span{color:var(--mute)}
.hint{font-size:11px;opacity:.55}
.sh{font-size:24px;margin:18px 0 10px;letter-spacing:-.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;font-family:inherit}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.stb th:nth-child(2),.stb td:nth-child(2){text-align:left}
.stb td:nth-child(2){display:flex;align-items:center;gap:6px;border-top:0}
.stb img{width:18px;height:18px;object-fit:contain}
.stb tr.me td{background:color-mix(in srgb,var(--ac) 18%,transparent);font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font-family:inherit;text-align:left}
.opt:last-child{border-bottom:0}
.opt small{color:var(--mute);font-size:12px;display:block}
.opt .go{color:var(--mute);font-size:18px}
.tg{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg.on{background:var(--ac)}.tg.on::after{left:21px}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.ck.on{background:var(--ac);border-color:var(--ac)}
.tl{display:flex;align-items:center;gap:10px;min-width:0}
.tl img{width:28px;height:28px;object-fit:contain;flex:none}

.bka{align-self:center;color:var(--mute);font-size:20px;padding-top:30px}
button.opt:not(:disabled) > .mini{background:var(--ac);border-color:var(--ac);color:#fff}

<body>
<header>
  <div class="top"><div><h1>Fixtures</h1><div id="sync"></div></div><button id="th" aria-label="Settings">⚙︎</button></div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="ptr"></div>
<main id="list"></main>
<div id="sheet"><div class="dwrap"><div class="bar"><button id="x">Close</button><button id="sb">Standings</button></div><div id="det"></div></div></div>
<div id="sheet2"><div class="dwrap"><div class="bar"><button id="x2">Close</button></div><div id="sd"></div></div></div>
<div id="sheet4"><div class="dwrap"><div class="bar"><button id="x4">Close</button></div><div id="pf"></div></div></div>
<div id="sheet3"><div class="dwrap"><div class="bar"><button id="x3">Done</button><button id="bk" style="display:none">Back</button></div><div id="st"></div></div></div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/';
const COMP={'eng.1':'Premier League','uefa.champions':'Champions League','eng.fa':'FA Cup','eng.league_cup':'EFL Cup',nfl:'NFL',nba:'NBA',mlb:'MLB',nhl:'NHL','college-football':'NCAA Football','mens-college-basketball':"NCAA Men's Basketball",'267979':'Gallagher Premiership',wnba:'WNBA'};
// Sports the picker offers. soccer leagues are selected per team: a club follows its domestic league plus cups.
const SPORTS={
 soccer:{n:'Soccer',ic:'⚽',lgs:[['eng.1','Premier League'],['esp.1','La Liga'],['ger.1','Bundesliga'],['ita.1','Serie A'],['fra.1','Ligue 1'],['usa.1','MLS']]},
 football:{n:'Football',ic:'🏈',lgs:[['nfl','NFL'],['college-football','NCAA Football']]},
 basketball:{n:'Basketball',ic:'🏀',lgs:[['nba','NBA'],['wnba','WNBA'],['mens-college-basketball',"NCAA Men's Basketball"]]},
 baseball:{n:'Baseball',ic:'⚾',lgs:[['mlb','MLB']]},
 hockey:{n:'Hockey',ic:'🏒',lgs:[['nhl','NHL']]},
 rugby:{n:'Rugby Union',ic:'🏉',lgs:[['267979','Gallagher Premiership']]}};
const NCAA=new Set(['college-football','mens-college-basketball']);
// Extra competitions a soccer club can play in, by domestic league.
const SOCCER_EXTRA={'eng.1':['uefa.champions','eng.fa','eng.league_cup'],'esp.1':['uefa.champions'],'ger.1':['uefa.champions'],'ita.1':['uefa.champions'],'fra.1':['uefa.champions'],'usa.1':[]};
Object.assign(COMP,{'esp.1':'La Liga','ger.1':'Bundesliga','ita.1':'Serie A','fra.1':'Ligue 1','usa.1':'MLS'});
const PAL=['#2a6fd6','#e8591a','#1fa85a','#c23b8a','#8a5cd6','#d6a21f','#1fa8a8','#d64545','#5c7a8a'];
// New installs start with no teams; people choose their own in Settings. Old saved key names (che/chi/bos) are migrated for existing users.
const LEGACY={che:'soccer:eng.1:363',chi:'football:nfl:3',bos:'basketball:nba:2'};
let TEAMS=ls_get('ft_teams',null)||[];
function ls_get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let data=ls.get('ft_data',{}),rev=new Set(ls.get('ft_rev',[])),cur=ls.get('ft_tab',TEAMS[0]?.k||''),busy=false,failed=false,again=false;
// carry old che/chi/bos cache + selected tab over to the new team keys
Object.keys(LEGACY).forEach(o=>{if(data[o]){if(!data[LEGACY[o]])data[LEGACY[o]]=data[o];delete data[o]}});
if(LEGACY[cur])cur=LEGACY[cur];
if(!TEAMS.some(x=>x.k===cur))cur=TEAMS[0]?.k||'';
const key=e=>e.lg+':'+e.id;
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
function norm(e,t,lg,po){
 const c=e.competitions?.[0];if(!c)return null;
 const us=c.competitors.find(x=>String(x.team.id)===String(t.id)),th=c.competitors.find(x=>x!==us);
 if(!us||!th)return null;
 const sc=x=>x.score&&typeof x.score==='object'?x.score.displayValue:x.score;
 const st=c.status?.type||e.status?.type||{};const isPo=!!po||Number(e.seasonType?.type)===3;
 return{id:e.id,lg,sp:t.sp,date:e.date,state:st.state||'pre',done:!!st.completed,ppd:/postpon|cancel|suspend/i.test(st.name||''),
  home:us.homeAway==='home',on:th.team.displayName||th.team.name,or:(r=>r>0&&r<=25?r:0)(th.curatedRank?.current),ol:th.team.logos?.[0]?.href||th.team.logo||'',
  us:sc(us),th:sc(th),w:us.winner===true?1:th.winner===true?-1:0,comp:(COMP[lg]||'')+(isPo?' Playoffs':''),po:isPo,wk:e.week?.number,rd:roundOf(e,c,isPo),tv:timeKnown(e,c)}}
// ESPN flags placeholder kickoffs with timeValid:false (common for far-off baseball games, sent as a midnight-Eastern stand-in).
// The flag is reliable, so trust it alone rather than guessing from the clock (real games can legitimately start at 00:00 UTC).
function timeKnown(e,c){return(c.timeValid??e.timeValid)!==false}
const clock=(d,e)=>e.tv===false?'TBA':d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
// round label for a game: soccer cups put it in seasonType.name; NHL/NBA/NFL put it in the note headline ("East 1st Round - Game 3")
// College headlines are long ("NCAA Men's Basketball Championship - East Region - Sweet 16", "College Football Playoff Quarterfinal at the Rose Bowl"):
// keep the part that names the round, drop the competition name, the region and the bowl.
function shortRound(h){
 const t=String(h||'');
 let m=t.match(/\b(First Four|1st Round|2nd Round|Sweet 16|Elite 8|Final Four|National Championship|Championship Game|First Round|Second Round|Quarterfinal|Semifinal)s?\b/i);
 if(/College Football Playoff|NCAA .*Championship/i.test(t)&&m){const r=m[1];return/^1st Round$/i.test(r)?'First Round':/^2nd Round$/i.test(r)?'Second Round':r.replace(/^\w/,x=>x.toUpperCase())}
 return t}
function roundOf(e,c,isPo){
 const h=(c.notes||[]).map(n=>n.headline||'').find(x=>/round|final|wild card|divisional|championship|super bowl|semi|quarter|leg/i.test(x)&&!/advance|win .* on pen/i.test(x));
 const st=e.seasonType?.name||'';
 if(h&&/College Football Playoff|NCAA .*Championship/i.test(h))return shortRound(h);
 if(h)return h.replace(/\s*-\s*(Game|Leg)\s*\d+.*$/i,'').replace(/^\d(st|nd) Leg.*$/i,st).trim()||st;
 return /round|final|leg|knockout/i.test(st)?st:''}
// Rugby: ESPN has no per-club schedule, so read the league scoreboard for last year, this year and next, and keep this club's games.
async function fetchRugby(t){
 const y=new Date().getFullYear(),lg=t.lg[0];
 const rs=await Promise.allSettled([y-1,y,y+1].map(n=>j(`${API}rugby/${lg}/scoreboard?dates=${n}&limit=400`)));
 const ok=rs.filter(r=>r.status==='fulfilled');if(!ok.length)throw new Error('all failed');
 const m={};ok.forEach(r=>(r.value.events||[]).forEach(e=>{const x=norm(e,t,lg,false);if(x)m[key(x)]=x}));
 return Object.values(m).sort((a,b)=>new Date(a.date)-new Date(b.date))}
async function fetchTeam(t){
 if(t.sp==='rugby')return fetchRugby(t);
 const urls=[];
 t.lg.forEach(lg=>{const b=`${API}${t.sp}/${lg}/teams/${t.id}/schedule`;
  if(t.sp==='soccer')urls.push([lg,b],[lg,b+'?fixture=true']);
  else[2,3].forEach(s=>urls.push([lg,b+'?seasontype='+s,s===3]))});
 const rs=await Promise.allSettled(urls.map(([lg,u,po])=>j(u).then(d=>(d.events||[]).map(e=>norm(e,t,lg,po)).filter(Boolean))));
 const ok=rs.filter(r=>r.status==='fulfilled');if(!ok.length)throw new Error('all failed');
 const m={};ok.forEach(r=>r.value.forEach(e=>{const k=key(e);if(!(m[k]&&m[k].done))m[k]=e}));
 return Object.values(m).sort((a,b)=>new Date(a.date)-new Date(b.date))}
async function refresh(){
 if(busy){again=true;return}busy=true;failed=false;again=false;$('#sync').textContent=TEAMS.length?'Updating…':'';
 await Promise.all(TEAMS.slice().map(async t=>{try{const ev=await fetchTeam(t);if(TEAMS.some(x=>x.k===t.k))data[t.k]={ts:Date.now(),ev}}catch{failed=true}}));
 Object.keys(data).forEach(k=>{if(!TEAMS.some(t=>t.k===k))delete data[k]});
 ls.set('ft_data',data);busy=false;updatePins();render();
 // a team was added/removed while this refresh was running: go again so nothing is left unfetched
 if(again){again=false;refresh()}}
function ago(ts){if(!ts)return'Never synced';const m=Math.round((Date.now()-ts)/6e4);return m<1?'Updated just now':m<60?`Updated ${m}m ago`:m<1440?`Updated ${Math.round(m/60)}h ago`:`Updated ${Math.round(m/1440)}d ago`}
function row(e,next){
 const d=new Date(e.date),dd=d.toLocaleDateString(undefined,{month:'short',day:'numeric'}),wd=d.toLocaleDateString(undefined,{weekday:'short'}),tm=clock(d,e);
 const past=e.done||e.state==='post',live=e.state==='in',k=key(e);let r;
 if(e.ppd)r='<span class="pill">Postponed</span>';
 else if(past||live){
  if(rev.has(k)){const c=e.w>0?'W':e.w<0?'L':'D';r=`<span class="sc ${c}">${live?'<span class="live">LIVE</span>':''}${esc(e.us)}–${esc(e.th)}<em>${live?'':c}</em></span>`}
  else r=`<span class="pill rv">${live?'Live · ':''}Reveal</span>`}
 else r=`<span class="tm">${tm}</span>`;
 return`<button class="row${next?' next':''}" data-k="${esc(k)}"><div class="dt"><b>${wd}</b>${dd}</div><div class="mid">${e.ol?`<img src="${esc(e.ol)}" alt="" onerror="this.remove()">`:''}<div><b>${e.home?'vs':'at'} ${e.or?`<small class="rk">#${e.or}</small> `:''}${esc(e.on)}</b><span>${esc(e.comp)}${e.wk?' · Wk '+e.wk:''}</span></div></div>${r}</button>`}
let view=ls.get('ft_view','up');
const pin={};
function updatePins(){TEAMS.forEach(t=>{const D=data[t.k];if(!D)return;
 const fin=D.ev.filter(e=>(e.done||e.state==='post')&&!e.ppd),last=fin[fin.length-1];
 // only the single most recent finished match can be pinned, and only until it's revealed
 pin[t.k]=last&&!rev.has(key(last))?key(last):null})}
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;ls.set('ft_view',view);render()}
 if(e.target.closest('#pick')){openSettings();sv='sports';renderSettings()}});
// the nickname for a followed team: "Boston Celtics" -> "Celtics", soccer clubs keep ESPN's short club name when we've learned one
const tabShort=t=>t.sn||shortName({displayName:t.n,id:t.id},t.sp==='soccer');
function fitTabs(){
 document.querySelectorAll('#tabs .tab>span:not(.hint)').forEach(s=>{s.textContent=s.dataset.f;if(s.scrollWidth>s.clientWidth+1&&s.dataset.s&&s.dataset.s!==s.dataset.f)s.textContent=s.dataset.s})}
let fitT=0;addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitTabs,80)});
function render(){
 const t=TEAMS.find(x=>x.k===cur);
 if(!t){
  // nothing followed yet: friendly empty state that points at Settings
  $('#tabs').innerHTML='';$('#sync').textContent='';
  $('#list').innerHTML=`<div class="empty"><div class="eic">🏆</div><h2>Pick your teams</h2><p>Follow your teams to see their fixtures and results here. Scores stay hidden until you reveal them.</p><button class="cta" id="pick">Choose teams</button></div>`;
  return}
 document.documentElement.style.setProperty('--ac',t.c);
 $('#tabs').innerHTML=TEAMS.map(x=>`<button class="tab${x.k===cur?' on':''}" style="--c:${x.c}" data-t="${x.k}"><i></i><span data-f="${esc(x.n)}" data-s="${esc(tabShort(x))}">${esc(x.n)}</span>${x.k===cur?'<span class="hint">▤</span>':''}</button>`).join('');
 fitTabs();
 const D=data[t.k];$('#sync').textContent=ago(D?.ts);
 let h=failed?'<div class="note">Couldn’t reach the schedule service. Showing what’s saved on this device.</div>':'';
 if(!D)h+=`<div class="note">${busy?'Loading schedule…':'No schedule saved yet. Tap Refresh while online.'}</div>`;
 else{
  const dn=e=>e.done||e.state==='post',pk=pin[t.k],pe=pk&&D.ev.find(e=>key(e)===pk);
  const up=D.ev.filter(e=>!dn(e)),pa=D.ev.filter(e=>dn(e)&&key(e)!==pk).reverse();
  if(pe)h+='<h2>Latest result</h2>'+row(pe);
  h+=`<div class="seg"><button data-v="up" class="${view==='up'?'on':''}">Upcoming <small>${up.length}</small></button><button data-v="res" class="${view==='res'?'on':''}">Results <small>${pa.length}</small></button></div>`;
  const L=view==='up'?up:pa;
  h+=L.length?L.map((e,i)=>row(e,view==='up'&&i===0)).join(''):`<div class="note">${view==='up'?'No upcoming games listed yet.':'No earlier results yet.'}</div>`}
 $('#list').innerHTML=h}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){if(b.dataset.t===cur){const t=TEAMS.find(x=>x.k===cur);if(t)openStandings(cur,defCtx(t));return}cur=b.dataset.t;ls.set('ft_tab',cur);render();scrollTo(0,0)}};
const th=$('#th');
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#14161a':'#f3f2ef';ls.set('ft_theme',t)}
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');

// ---- settings: theme, reveal-all per team, manage teams ----
let sv='main',pSport=null,pLg=null,pList=null,pQ='',pTok=0;
const isDone=e=>e.done||e.state==='post';
const finished=t=>(data[t.k]?.ev||[]).filter(e=>isDone(e)&&!e.ppd);
const allRevealed=t=>{const F=finished(t);return F.length>0&&F.every(e=>rev.has(key(e)))};
const saveTeams=()=>ls.set('ft_teams',TEAMS);
function openSettings(){sv='main';$('#sheet3').classList.add('open');$('#sheet3').scrollTop=0;renderSettings()}
function closeSettings(){$('#sheet3').classList.remove('open');updatePins();render()}
function renderSettings(){
 const dark=document.documentElement.dataset.theme==='dark',bk=$('#bk');
 bk.style.display=sv==='main'?'none':'';$('#x3').textContent=sv==='main'?'Done':'Done';
 if(sv==='main'){
  $('#st').innerHTML=`<h1 class="sh">Settings</h1>
   <div class="pl"><button class="opt" data-a="theme"><span>Dark mode</span><span class="tg${dark?' on':''}"></span></button></div>
   <h3>Reveal all results</h3>
   <div class="pl">${TEAMS.length?TEAMS.map(t=>{const n=finished(t).filter(e=>!rev.has(key(e))).length;return`<button class="opt" data-a="rv" data-k="${esc(t.k)}"${n?'':' disabled'}><span class="tl"><i style="background:${t.c}"></i><b>${esc(t.n)}</b></span><span class="mini">${n?`Reveal ${n}`:'All revealed'}</span></button>`}).join(''):'<div class="note" style="margin:8px 0">Follow a team to see it here.</div>'}</div>
   <div class="note">Reveals every result that has already finished, once. Games that finish later stay hidden until you reveal them.</div>
   <h3>Teams</h3>
   <div class="pl"><button class="opt" data-a="teams"><span>Choose teams to follow<small>${TEAMS.length} followed</small></span><span class="go">›</span></button></div>
   <div class="cred">
    <h3>About &amp; Credits</h3>
    <p>Data comes from ESPN's public feeds, and team logos belong to the respective leagues and clubs. Your app preferences are stored only in this browser, with no accounts and no tracking. The app talks to no server other than ESPN's data feeds and image servers and the one hosting this page.</p>
    <p class="fine">Not affiliated with or endorsed by ESPN or any league or team. Feeds can change or disappear without notice, and data may be delayed or wrong.</p>
   </div>`}
 else if(sv==='sports'){
  $('#st').innerHTML=`<h1 class="sh">Your teams</h1>
   <div class="pl">${TEAMS.map(t=>`<div class="opt"><span class="tl"><i style="background:${t.c}"></i><b>${esc(t.n)}</b><small>${esc(SPORTS[t.sp].n)}</small></span><button class="mini" data-a="rm" data-k="${esc(t.k)}">Remove</button></div>`).join('')||'<div class="note" style="margin:8px 0">No teams yet.</div>'}</div>
   <h3>Add a team</h3>
   <div class="pl">${Object.entries(SPORTS).map(([k,s])=>`<button class="opt" data-a="sport" data-s="${k}"><span>${s.ic} ${esc(s.n)}</span><span class="go">›</span></button>`).join('')}</div>`}
 else if(sv==='league'){
  const S=SPORTS[pSport];
  $('#st').innerHTML=`<h1 class="sh">${S.ic} ${esc(S.n)}</h1><div class="pl">${S.lgs.map(l=>`<button class="opt" data-a="lg" data-l="${l[0]}"><span>${esc(l[1])}</span><span class="go">›</span></button>`).join('')}</div>`}
 else renderPicker()}
async function renderPicker(){
 const tok=++pTok,S=SPORTS[pSport],name=COMP[pLg]||pLg;
 const hd=`<h1 class="sh">${esc(name)}</h1><input class="srch" id="q" type="search" placeholder="Search teams" value="${esc(pQ)}" autocomplete="off" autocapitalize="off">`;
 if(!pList){$('#st').innerHTML=hd+'<div class="note">Loading teams…</div>';
  pList=await loadTeams(pSport,pLg);if(tok!==pTok)return}
 const has=id=>TEAMS.some(t=>t.sp===pSport&&String(t.id)===String(id)&&t.lg[0]===pLg);
 const q=pQ.trim().toLowerCase(),L=pList.filter(t=>!q||t.n.toLowerCase().includes(q));
 const body=!pList.length?'<div class="note">Couldn’t load teams. Check your connection and go back to try again.</div>':
  `<div class="pl">${L.map(t=>`<button class="opt" data-a="tm" data-id="${esc(t.id)}"><span class="tl">${t.l?`<img src="${esc(t.l)}" alt="" onerror="this.remove()">`:'<i style="background:'+(t.c||'var(--mute)')+'"></i>'}<b>${esc(t.n)}</b></span><span class="ck${has(t.id)?' on':''}">${has(t.id)?'✓':''}</span></button>`).join('')||'<div class="note" style="margin:8px 0">No matches.</div>'}</div>`;
 const keep=document.activeElement?.id==='q';
 $('#st').innerHTML=hd+body;
 if(keep){const q2=$('#q');q2.focus();q2.setSelectionRange(pQ.length,pQ.length)}}
async function loadTeams(sp,lg){
 // names + logos come from the standings feed (browser-readable for every league). Colors come from the /teams list,
 // which only some leagues allow from a web page, so it's best-effort and merged in by team id.
 const ck='ft_tl_'+sp+'_'+lg;
 let L=[];
 try{
  const d=await j(`${SAPI}${sp}/${lg}/standings`),seen=new Set();
  (function w(n){(n.standings?.entries||[]).forEach(e=>{const t=e.team;if(!t||seen.has(String(t.id)))return;seen.add(String(t.id));
    L.push({id:String(t.id),n:t.displayName||t.shortDisplayName||t.name,l:t.logos?.[0]?.href||'',c:'',a:''})});(n.children||[]).forEach(w)})(d)}catch{}
 try{
  const d=await j(`${API}${sp}/${lg}/teams?limit=1000&lang=en`),by={};
  (d.sports?.[0]?.leagues?.[0]?.teams||[]).forEach(x=>{const t=x.team;if(t)by[String(t.id)]=t});

  return`<div class="bk"><div class="bkh">${esc(r.n)}</div><div class="bkc ${cls}"${tapKey?` data-m="${esc(tapKey)}"`:''}>${opp.ol?`<img src="${esc(opp.ol)}" alt="" onerror="this.remove()">`:''}<b>${esc(opp.on)}</b><span class="bkr">${res}</span>${sub?`<small>${sub}</small>`:''}</div></div>`}).join('<div class="bka">›</div>');
 return`<h3>Path</h3><div class="bkw">${cols}</div>`}
function openStandings(k,c){sTeam=k;sCtx=c;$('#sheet2').classList.add('open');$('#sheet2').scrollTop=0;renderStandings()}
async function renderStandings(){
 const tok=++sTok,t=TEAMS.find(x=>x.k===sTeam),CX=ctxFor(t),cx=CX.find(c=>c[0]===sCtx)||CX[0];
 document.documentElement.style.setProperty('--ac',t.c);
 const hd=`<h1 class="sh">${esc(t.n)}</h1><div class="chips">${CX.map(c=>`<button data-c="${c[0]}" class="${c[0]===cx[0]?'on':''}">${esc(c[1])}</button>`).join('')}</div>`;
 const mt=cx[2]!=='t'?matches(t,cx[0]):'';
 if(cx[2]==='p'){const b=bracket(t,cx[0]);$('#sd').innerHTML=hd+(b||'<div class="note">No games in this competition yet.</div>')+mt;return}
 $('#sd').innerHTML=hd+'<div class="note">Loading table…</div>'+mt;
 let gs;
 if(t.sp==='football'&&!NCAA.has(t.lg[0])){const r=await Promise.all([getStand(t,cx[0],'?level=3'),getStand(t,cx[0],'')]);gs=[...(r[0]||[]),...(r[1]||[])]}
 else gs=(await getStand(t,cx[0],''))||[];
 if(tok!==sTok)return;
 const seen=new Set(),mine=g=>g.rows.some(r=>r.id===String(t.id));
 gs=gs.filter(g=>!seen.has(g.name)&&seen.add(g.name));
 // football: your division, your conference, then the other conference (divisions of the other conference are left out to stay readable)
 const isConf=g=>/conference/i.test(g.name);
 gs=t.sp==='football'&&!NCAA.has(t.lg[0])?[...gs.filter(g=>mine(g)&&!isConf(g)),...gs.filter(g=>mine(g)&&isConf(g)),...gs.filter(g=>!mine(g)&&isConf(g))]:[...gs.filter(mine),...gs.filter(g=>!mine(g))];
 if(NCAA.has(t.lg[0]))gs=gs.filter(mine);
 $('#sd').innerHTML=hd+(gs.length?gs.map(g=>tbl(g,t)).join(''):'<div class="note">Couldn’t load standings. Check your connection and try again.</div>')+mt}
$('#sd').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){sCtx=b.dataset.c;renderStandings()}});
$('#sb').onclick=()=>{if(curEv)openStandings(cur,ctxKey(curEv))};
$('#x2').onclick=()=>{$('#sheet2').classList.remove('open');render()};
// freeze the page behind an open sheet (stops the iPhone toolbar/bounce from resizing the sheet at its very bottom edge)
{const sheets=['#sheet','#sheet2','#sheet3','#sheet4'].map(q=>$(q)),sync=()=>document.documentElement.classList.toggle('lock',sheets.some(x=>x.classList.contains('open')));
 if(typeof MutationObserver!=='undefined')sheets.forEach(x=>new MutationObserver(sync).observe(x,{attributes:true,attributeFilter:['class']}));sync()}
updatePins();render();
{const old=Object.values(data).some(x=>Date.now()-x.ts>36e5||x.ev.some(e=>!('tv' in e)));if(TEAMS.length&&(!Object.keys(data).length||old))refresh()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TEAMS.length&&Object.values(data).some(x=>Date.now()-x.ts>36e5))refresh()});
</script>
